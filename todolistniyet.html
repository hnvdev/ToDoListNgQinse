<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/posa.png" type="image/png">
    <title>To-Do List ni Sinagtala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styleniyet.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-Do List ng Qinse</h1>
            <form class="input-area" id="task-form">
                <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
                <button type="submit" id="add-task-btn" aria-label="Add task"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div class="todos-container">
                <ul id="task-list"></ul>    
                <img class="empty-image" src="./images/posa.png" alt="empty">
            </div>
        </div>
    </div>
    <script src="scriptniyet.js"></script>
</body>
</html>
